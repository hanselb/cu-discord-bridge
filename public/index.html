<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-900 text-gray-100 font-sans antialiased">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discord Low-Data Relay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #2f3136; }
    ::-webkit-scrollbar-thumb { background: #202225; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #18191c; }
  </style>
</head>
<body class="h-full m-0 p-0 overflow-hidden bg-gray-900 select-none">

  <discord-app class="flex h-full w-full"></discord-app>

  <script>
    window.AppState = {
      socket: null,
      connected: false,
      categoryName: "LOADING CATEGORY...",
      channels: [],
      activeChannelId: null,
      nickname: localStorage.getItem("cuban_relay_nick") || "",
      avatarUrl: localStorage.getItem("cuban_relay_avatar") || "",
      metaToken: localStorage.getItem("cuban_relay_meta_token") || "",
      messages: {},
      unreads: {}
    };

    function formatTime(isoOrDate) {
      try {
        const d = typeof isoOrDate === 'string' ? new Date(isoOrDate) : isoOrDate;
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      } catch {
        return '';
      }
    }

    window.fbAsyncInit = function() {
      FB.init({
        appId: 'YOUR_META_APP_ID',
        cookie: true,
        xfbml: true,
        version: 'v19.0'
      });

      FB.getLoginStatus(function(response) {
        if (response.status === 'connected') {
          fetchMetaUserData(response.authResponse.accessToken);
        } else if (!AppState.nickname) {
          const app = document.querySelector("discord-app");
          if (app) app.showLoginModal(true);
        }
      });
    };

    function fetchMetaUserData(token) {
      if (token) {
        localStorage.setItem("cuban_relay_meta_token", token);
        AppState.metaToken = token;
      }
      FB.api('/me', { fields: 'name,picture.type(large)' }, function(response) {
        if (response && !response.error) {
          AppState.nickname = response.name || '';
          AppState.avatarUrl = response.picture?.data?.url || '';
          localStorage.setItem("cuban_relay_nick", AppState.nickname);
          localStorage.setItem("cuban_relay_avatar", AppState.avatarUrl);
          window.dispatchEvent(new CustomEvent("nickname-updated"));
          document.querySelector("discord-login-modal")?.remove();
        }
      });
    }

    function loginWithMeta() {
      FB.login(function(response) {
        if (response.authResponse) {
          fetchMetaUserData(response.authResponse.accessToken);
        }
      }, { scope: 'public_profile' });
    }

    class DiscordApp extends HTMLElement {
      connectedCallback() {
        this.render();
        this.initSocket();

        window.addEventListener("nickname-updated", () => this.handleNicknameChange());
        window.addEventListener("channel-switch", (e) => this.switchChannel(e.detail.channelId));
      }

      initSocket() {
        AppState.socket = io({
          transports: ['websocket', 'polling'],
          reconnectionAttempts: 15,
          timeout: 10000
        });

        AppState.socket.on("connect", () => {
          AppState.connected = true;
          window.dispatchEvent(new CustomEvent("socket-status-change"));
        });

        AppState.socket.on("disconnect", () => {
          AppState.connected = false;
          window.dispatchEvent(new CustomEvent("socket-status-change"));
        });

        AppState.socket.on("init_data", (data) => {
          this.applyCategoryData(data);
          if (AppState.activeChannelId) {
            this.requestChannelHistory(AppState.activeChannelId);
          }
        });

        AppState.socket.on("category_updated", (data) => {
          this.applyCategoryData(data);
        });

        AppState.socket.on("channel_history", (data) => {
          AppState.messages[data.channelId] = data.messages || [];
          if (AppState.activeChannelId === data.channelId) {
            window.dispatchEvent(new CustomEvent("messages-updated"));
          }
        });

        AppState.socket.on("new_message", (msg) => {
          if (!AppState.messages[msg.channelId]) {
            AppState.messages[msg.channelId] = [];
          }
          // simple de-dupe by id
          if (!AppState.messages[msg.channelId].some(m => m.id === msg.id)) {
            AppState.messages[msg.channelId].push(msg);
          }

          if (msg.channelId === AppState.activeChannelId) {
            window.dispatchEvent(new CustomEvent("messages-updated"));
          } else {
            AppState.unreads[msg.channelId] = true;
            window.dispatchEvent(new CustomEvent("channels-updated"));
          }
        });
      }

      applyCategoryData(data) {
        AppState.categoryName = data.categoryName || "DISCORD CATEGORY";
        AppState.channels = data.channels || [];

        // If current channel disappeared, reset
        if (AppState.activeChannelId &&
            !AppState.channels.some(c => c.id === AppState.activeChannelId)) {
          AppState.activeChannelId = AppState.channels[0]?.id || null;
          if (AppState.activeChannelId) {
            this.requestChannelHistory(AppState.activeChannelId);
          }
        }

        if (!AppState.activeChannelId && AppState.channels.length > 0) {
          AppState.activeChannelId = AppState.channels[0].id;
          this.requestChannelHistory(AppState.activeChannelId);
        }

        window.dispatchEvent(new CustomEvent("channels-updated"));
        window.dispatchEvent(new CustomEvent("messages-updated"));
      }

      requestChannelHistory(channelId) {
        if (AppState.socket?.connected && channelId) {
          AppState.socket.emit("get_history", { channelId });
        }
      }

      switchChannel(channelId) {
        if (AppState.activeChannelId === channelId) return;
        AppState.activeChannelId = channelId;
        AppState.unreads[channelId] = false;

        window.dispatchEvent(new CustomEvent("channels-updated"));

        if (!AppState.messages[channelId]) {
          this.requestChannelHistory(channelId);
        }
        window.dispatchEvent(new CustomEvent("messages-updated"));
      }

      handleNicknameChange() {
        this.querySelector("discord-sidebar")?.render();
      }

      showLoginModal(isMandatory = false) {
        if (document.querySelector("discord-login-modal")) return;
        const modal = document.createElement("discord-login-modal");
        modal.setAttribute("mandatory", isMandatory ? "true" : "false");
        document.body.appendChild(modal);
      }

      render() {
        this.innerHTML = `
          <discord-sidebar class="w-60 md:w-64 bg-[#2f3136] flex flex-col flex-shrink-0 border-r border-[#202225] select-none"></discord-sidebar>
          <discord-chat class="flex-1 flex flex-col bg-[#36393f] overflow-hidden min-w-0"></discord-chat>
        `;
      }
    }

    class DiscordSidebar extends HTMLElement {
      connectedCallback() {
        this.render();
        window.addEventListener("channels-updated", () => this.render());
        window.addEventListener("nickname-updated", () => this.render());
      }

      render() {
        const channelsHtml = AppState.channels.map(ch => {
          const isActive = ch.id === AppState.activeChannelId;
          const hasUnread = AppState.unreads[ch.id];

          return `
            <button
              onclick="window.dispatchEvent(new CustomEvent('channel-switch', { detail: { channelId: '${ch.id}' } }))"
              class="w-full text-left px-2.5 py-1.5 rounded-md flex items-center justify-between text-sm transition-colors group ${
                isActive
                  ? 'bg-[#393c43] text-white font-semibold'
                  : 'text-gray-400 hover:bg-[#34373c] hover:text-gray-200'
              }"
            >
              <span class="flex items-center gap-1.5 truncate">
                <span class="text-gray-500 font-bold text-lg leading-none">#</span>
                <span class="truncate ${hasUnread && !isActive ? 'text-white font-bold' : ''}">${this.escape(ch.name)}</span>
              </span>
              ${hasUnread && !isActive ? `<span class="w-2 h-2 rounded-full bg-white shadow-sm"></span>` : ''}
            </button>
          `;
        }).join('');

        const avatarSrc = AppState.avatarUrl ||
          `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(AppState.nickname || 'User')}`;

        const isMeta = !!AppState.metaToken && !!AppState.nickname;

        this.innerHTML = `
          <div class="h-12 px-4 border-b border-[#202225] shadow-sm flex items-center justify-between bg-[#2f3136]">
            <h2 class="font-bold text-xs uppercase tracking-wider text-gray-300 truncate">${this.escape(AppState.categoryName)}</h2>
          </div>

          <div class="p-2 space-y-0.5 flex-1 overflow-y-auto">
            <div class="text-[11px] font-bold text-gray-400 uppercase tracking-wider px-2 py-1">
              TEXT CHANNELS
            </div>
            ${channelsHtml || '<div class="px-2 py-4 text-xs text-gray-500">No channels in category</div>'}
          </div>

          <div class="h-14 px-3 bg-[#292b2f] border-t border-[#202225] flex items-center justify-between text-xs">
            <div class="flex items-center gap-2 min-w-0">
              <img src="${avatarSrc}" class="w-8 h-8 rounded-full bg-gray-700 flex-shrink-0 object-cover" alt="Avatar" />
              <div class="flex flex-col min-w-0">
                <span class="font-bold text-white truncate text-xs">${this.escape(AppState.nickname || 'Guest')}</span>
                <span class="text-[10px] ${isMeta ? 'text-emerald-400' : 'text-gray-500'} truncate flex items-center gap-1">
                  <span class="w-1.5 h-1.5 rounded-full ${isMeta ? 'bg-emerald-400' : 'bg-gray-500'}"></span>
                  ${isMeta ? 'Meta Verified' : 'Guest'}
                </span>
              </div>
            </div>
            <button
              onclick="document.querySelector('discord-app').showLoginModal(false)"
              title="Switch Account"
              class="p-1.5 text-gray-400 hover:text-white hover:bg-gray-700 rounded transition-colors"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
            </button>
          </div>
        `;
      }

      escape(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, m =>
          ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m])
        );
      }
    }

    class DiscordChat extends HTMLElement {
      connectedCallback() {
        this.render();
        window.addEventListener("messages-updated", () => this.renderMessages());
        window.addEventListener("channels-updated", () => this.renderHeader());
        window.addEventListener("socket-status-change", () => this.renderHeader());
      }

      renderHeader() {
        const headerTitle = this.querySelector("#chat-channel-title");
        const statusBadge = this.querySelector("#chat-status-badge");
        const input = this.querySelector("#message-input");
        const activeCh = AppState.channels.find(c => c.id === AppState.activeChannelId);

        if (headerTitle) {
          headerTitle.textContent = activeCh ? activeCh.name : "Select Channel";
        }
        if (statusBadge) {
          statusBadge.className = `px-2 py-0.5 text-[10px] rounded-full font-semibold ${
            AppState.connected ? "bg-emerald-500/20 text-emerald-400" : "bg-amber-500/20 text-amber-400"
          }`;
          statusBadge.textContent = AppState.connected ? "Connected" : "Reconnecting...";
        }
        if (input && activeCh) {
          input.placeholder = `Message #${activeCh.name}`;
        }
      }

      renderMessages() {
        const container = this.querySelector("#message-container");
        if (!container) return;

        const currentMsgs = AppState.messages[AppState.activeChannelId] || [];

        if (currentMsgs.length === 0) {
          container.innerHTML = `
            <div class="flex flex-col items-center justify-center h-full text-gray-500 text-sm">
              <span class="text-3xl mb-2">💬</span>
              <p>No messages in this channel yet.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = currentMsgs.map(msg => {
          const time = formatTime(msg.timestamp || msg.time);
          return `
            <discord-message
              user="${this.escapeHtml(msg.user)}"
              avatar="${this.escapeHtml(msg.avatar || '')}"
              time="${this.escapeHtml(time)}"
              text="${this.escapeHtml(msg.text)}"
              media="${msg.mediaUrl ? this.escapeHtml(msg.mediaUrl) : ''}"
            ></discord-message>
          `;
        }).join('');

        // Keep scroll at bottom
        requestAnimationFrame(() => {
          container.scrollTop = container.scrollHeight;
        });
      }

      escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, m =>
          ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m])
        );
      }

      sendMessage(e) {
        e.preventDefault();
        const input = this.querySelector("#message-input");
        const text = (input?.value || '').trim();

        if (!text || !AppState.activeChannelId) return;

        if (!AppState.nickname) {
          document.querySelector("discord-app")?.showLoginModal(true);
          return;
        }

        const payload = {
          channelId: AppState.activeChannelId,
          user: AppState.nickname,
          avatar: AppState.avatarUrl,
          text
        };

        if (AppState.socket?.connected) {
          AppState.socket.emit("send_message", payload);
        } else {
          // Offline fallback (local only)
          if (!AppState.messages[AppState.activeChannelId]) {
            AppState.messages[AppState.activeChannelId] = [];
          }
          AppState.messages[AppState.activeChannelId].push({
            ...payload,
            id: 'local-' + Date.now(),
            timestamp: new Date().toISOString()
          });
          this.renderMessages();
        }

        input.value = "";
      }

      render() {
        const activeCh = AppState.channels.find(c => c.id === AppState.activeChannelId);
        const channelName = activeCh ? activeCh.name : "general";

        this.innerHTML = `
          <div class="h-12 px-4 border-b border-[#202225] shadow-sm bg-[#36393f] flex items-center justify-between flex-shrink-0">
            <div class="flex items-center gap-2 min-w-0">
              <span class="text-gray-400 text-xl font-bold">#</span>
              <h3 id="chat-channel-title" class="font-bold text-white text-base truncate">${this.escapeHtml(channelName)}</h3>
            </div>
            <span id="chat-status-badge" class="px-2 py-0.5 text-[10px] rounded-full font-semibold ${
              AppState.connected ? "bg-emerald-500/20 text-emerald-400" : "bg-amber-500/20 text-amber-400"
            }">
              ${AppState.connected ? "Connected" : "Reconnecting..."}
            </span>
          </div>

          <div id="message-container" class="flex-1 p-4 overflow-y-auto space-y-3"></div>

          <div class="p-3 bg-[#36393f] flex-shrink-0">
            <form onsubmit="document.querySelector('discord-chat').sendMessage(event)" class="flex gap-2 bg-[#40444b] p-2 rounded-lg border border-transparent focus-within:border-indigo-500">
              <input
                type="text"
                id="message-input"
                placeholder="Message #${this.escapeHtml(channelName)}"
                class="flex-1 bg-transparent px-2 text-sm text-white focus:outline-none placeholder-gray-400"
                autocomplete="off"
                maxlength="2000"
              />
              <button
                type="submit"
                class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-1.5 rounded-md text-xs font-semibold transition-colors"
              >
                Send
              </button>
            </form>
          </div>
        `;

        this.renderMessages();
      }
    }

    class DiscordMessage extends HTMLElement {
      connectedCallback() {
        const user = this.getAttribute("user") || "Unknown";
        const avatar = this.getAttribute("avatar") ||
          `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(user)}`;
        const time = this.getAttribute("time") || "";
        const text = this.getAttribute("text") || "";
        const media = this.getAttribute("media") || "";

        this.innerHTML = `
          <div class="flex items-start gap-3 group py-0.5 hover:bg-[#32353b] -mx-2 px-2 rounded">
            <img src="${avatar}" class="w-9 h-9 rounded-full bg-gray-700 flex-shrink-0 mt-0.5 object-cover" alt="" />
            <div class="flex-1 min-w-0">
              <div class="flex items-baseline gap-2">
                <span class="font-medium text-sm text-white">${user}</span>
                <span class="text-[11px] text-gray-400">${time}</span>
              </div>
              <p class="text-sm text-gray-200 mt-0.5 break-words leading-relaxed whitespace-pre-wrap">${text}</p>
              ${media ? `<discord-image-placeholder data-src="${media}"></discord-image-placeholder>` : ''}
            </div>
          </div>
        `;
      }
    }

    class DiscordImagePlaceholder extends HTMLElement {
      connectedCallback() {
        const src = this.getAttribute("data-src");
        if (!src) return;

        this.innerHTML = `
          <div class="mt-2 inline-block">
            <button class="text-xs bg-[#2f3136] hover:bg-[#202225] border border-gray-600 text-indigo-300 hover:text-indigo-200 px-3 py-1.5 rounded flex items-center gap-2 transition-colors shadow-sm">
              <span>🖼️</span>
              <span>[Image - Click to load]</span>
            </button>
          </div>
        `;

        const btn = this.querySelector("button");
        btn.addEventListener("click", () => {
          btn.innerHTML = `<span class="animate-pulse">Loading image...</span>`;
          const img = document.createElement("img");
          img.src = src;
          img.alt = "attachment";
          img.className = "max-w-xs md:max-w-md max-h-60 rounded border border-gray-700 mt-2 shadow-md";
          img.onload = () => this.replaceWith(img);
          img.onerror = () => {
            btn.innerHTML = `<span class="text-red-400">Failed to load image</span>`;
          };
        });
      }
    }

    class DiscordLoginModal extends HTMLElement {
      connectedCallback() {
        const isMandatory = this.getAttribute("mandatory") === "true";

        this.innerHTML = `
          <div class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-[#36393f] w-full max-w-sm rounded-lg shadow-2xl border border-gray-700 overflow-hidden text-center p-6 space-y-5">
              <div class="space-y-1">
                <h3 class="text-xl font-bold text-white">Welcome to Relay</h3>
                <p class="text-xs text-gray-400">Log in with Meta to send messages using your verified name and avatar.</p>
              </div>

              <button
                onclick="loginWithMeta()"
                class="w-full bg-[#1877F2] hover:bg-[#166fe5] text-white font-semibold py-2.5 px-4 rounded transition-colors flex items-center justify-center gap-2 shadow-md"
              >
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                  <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                </svg>
                <span>Continue with Meta</span>
              </button>

              ${!isMandatory ? `
                <button
                  onclick="this.closest('discord-login-modal').remove()"
                  class="text-xs text-gray-400 hover:text-gray-200 underline"
                >
                  Close
                </button>
              ` : ''}
            </div>
          </div>
        `;
      }
    }

    customElements.define("discord-app", DiscordApp);
    customElements.define("discord-sidebar", DiscordSidebar);
    customElements.define("discord-chat", DiscordChat);
    customElements.define("discord-message", DiscordMessage);
    customElements.define("discord-image-placeholder", DiscordImagePlaceholder);
    customElements.define("discord-login-modal", DiscordLoginModal);
  </script>
</body>
</html>
